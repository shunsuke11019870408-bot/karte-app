<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ENBASE カルテ</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141210">

<!-- iOS: add to home screen as a standalone app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ENBASE">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<style>
  :root{
    --bg:#f4f1ea;
    --panel:#ffffff;
    --ink:#19160f;
    --sub:#726c5d;
    --line:#e8e2d3;
    --accent:#c9a24b;
    --accent-dark:#a9823a;
    --accent-soft:#f4ead0;
    --header-bg:#141210;
    --danger:#c0453a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--header-bg);
    color:#fff;
    padding:14px 20px;
    padding-top:max(14px, env(safe-area-inset-top));
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 16px rgba(0,0,0,.18);
  }
  header .logo-mark{
    height:26px;
    display:block;
  }
  header .spacer{flex:1;}
  header button, .btn{
    background:var(--accent);
    color:#201a0d;
    border:none;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    letter-spacing:.02em;
    transition:background .15s ease, transform .1s ease;
  }
  header button:hover, .btn:hover{background:#d8b566;}
  header button:active, .btn:active{transform:scale(.97);}
  header input[type=file]{display:none;}
  header #btnLogout{background:#2a241b;color:#e8e2d3;}
  header #btnLogout:hover{background:#39311f;}
  main{
    max-width:920px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:18px;
    box-shadow:0 1px 2px rgba(25,22,15,.03), 0 10px 30px -18px rgba(25,22,15,.25);
  }
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .toolbar input[type=search]{
    flex:1;
    min-width:160px;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:14px;
    background:#fff;
  }
  .kiosk-cta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:linear-gradient(135deg, var(--header-bg), #2a241b);
    color:#fff;
    border-radius:var(--radius);
    padding:20px 24px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .kiosk-cta .txt{flex:1;min-width:200px;}
  .kiosk-cta .txt h3{margin:0 0 4px;font-size:16px;letter-spacing:.01em;}
  .kiosk-cta .txt p{margin:0;font-size:13px;color:#cfc8b6;}
  .kiosk-cta .btn{background:var(--accent);color:#201a0d;padding:11px 20px;font-size:14px;}
  table{width:100%;border-collapse:collapse;}
  th,td{
    text-align:left;
    padding:12px 10px;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  th{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--sub);
    font-weight:600;
  }
  tr.customer-row{cursor:pointer;transition:background .1s ease;}
  tr.customer-row:hover{background:var(--accent-soft);}
  .badge-web{
    display:inline-block;
    background:var(--header-bg);
    color:var(--accent);
    font-size:10px;
    font-weight:700;
    letter-spacing:.04em;
    padding:2px 8px;
    border-radius:999px;
    margin-left:6px;
    vertical-align:middle;
  }
  .muted{color:var(--sub);font-size:13px;}
  .empty{
    text-align:center;
    color:var(--sub);
    padding:48px 0;
  }
  label{
    display:block;
    font-size:12px;
    letter-spacing:.03em;
    color:var(--sub);
    margin-bottom:5px;
    margin-top:14px;
    font-weight:600;
  }
  input[type=text],input[type=tel],input[type=date],input[type=email],input[type=password],textarea,select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(201,162,75,.22);
  }
  textarea{resize:vertical;min-height:70px;}
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px;
  }
  .row-actions{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .row-actions .danger{background:var(--danger);color:#fff;}
  .row-actions .danger:hover{background:#d2554a;}
  .row-actions .ghost{background:#efe9db;color:var(--ink);}
  .row-actions .ghost:hover{background:#e5ddc9;}
  h2{
    font-size:16px;
    margin:0 0 16px;
    padding-left:12px;
    border-left:3px solid var(--accent);
    letter-spacing:.01em;
  }
  h3{font-size:14px;margin:24px 0 10px;color:var(--accent-dark);letter-spacing:.02em;}
  .visit-card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    background:#fdfcf8;
  }
  .visit-card .visit-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:6px;
  }
  .visit-card .visit-date{font-weight:700;font-size:15px;}
  .tag{
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent-dark);
    border-radius:999px;
    padding:3px 11px;
    font-size:12px;
    font-weight:600;
    margin:2px 4px 2px 0;
  }
  .visit-detail{white-space:pre-wrap;font-size:14px;margin-top:6px;line-height:1.6;}
  .photo-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photo-row img{
    width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);
    cursor:pointer;
  }
  .visit-buttons{margin-top:10px;display:flex;gap:8px;}
  .visit-buttons button{
    background:none;border:1px solid var(--line);color:var(--sub);
    padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;
  }
  .visit-buttons button:hover{background:var(--accent-soft);border-color:var(--accent-soft);}
  .checkrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .checkrow label{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--ink);margin:0;font-weight:400;letter-spacing:0;}
  .checkrow input{width:auto;margin:0;}
  .photo-input-wrap{margin-top:8px;}
  .back-link{
    display:inline-block;margin-bottom:14px;color:var(--accent-dark);
    cursor:pointer;font-size:14px;font-weight:600;
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;
  }
  .modal{
    background:#fff;border-radius:var(--radius);padding:20px;max-width:520px;width:100%;
    max-height:90vh;overflow:auto;
  }
  #printArea{display:none;}
  @media print{
    header,.toolbar,.kiosk-cta,.row-actions,.back-link,.visit-buttons,.photo-input-wrap,.modal-overlay{display:none !important;}
    main > .panel{display:none !important;}
    #printArea{display:block !important;}
    #printArea h2{border:none;padding:0;}
  }
  .zoom-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.8);
    display:flex;align-items:center;justify-content:center;z-index:200;
  }
  .zoom-overlay img{max-width:92vw;max-height:92vh;border-radius:6px;}
  .save-note{font-size:12px;color:var(--sub);margin-top:10px;}

  /* ---------- kiosk / login / loading (full-screen dark) ---------- */
  body.kiosk-mode{background:var(--header-bg);}
  body.kiosk-mode header{display:none;}
  .kiosk-shell{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px 40px;
  }
  .kiosk-logo{width:min(380px, 78vw);margin-bottom:30px;}
  .kiosk-card{
    background:#fff;
    border-radius:22px;
    padding:34px 28px;
    max-width:560px;
    width:100%;
    box-shadow:0 30px 70px -24px rgba(0,0,0,.55);
  }
  .kiosk-card h2{
    font-size:21px;text-align:center;border:none;padding:0;margin-bottom:6px;
  }
  .kiosk-sub{text-align:center;color:var(--sub);margin-bottom:22px;font-size:13px;line-height:1.6;}
  .kiosk-submit{
    width:100%;
    margin-top:22px;
    padding:15px;
    font-size:16px;
    border-radius:999px;
    background:var(--accent);
    color:#201a0d;
    border:none;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .kiosk-submit:hover{background:#d8b566;}
  .kiosk-footer-link{
    display:block;text-align:center;margin-top:20px;color:#a39c86;font-size:12px;cursor:pointer;
  }
  .kiosk-thanks{
    text-align:center;color:#fff;
  }
  .kiosk-thanks .check{
    width:64px;height:64px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
    font-size:30px;color:#201a0d;
  }
  .kiosk-thanks h2{color:#fff;font-size:22px;margin-bottom:10px;border:none;padding:0;}
  .kiosk-thanks p{color:#cfc8b6;font-size:14px;line-height:1.7;}
  .kiosk-thanks .ghost-link{
    display:inline-block;margin-top:26px;color:var(--accent);font-size:13px;cursor:pointer;font-weight:600;
  }
  .loading-text{color:#cfc8b6;font-size:14px;}
</style>
</head>
<body>
<header>
  <img class="logo-mark" src="logo-header.png" alt="ENBASE">
  <div class="spacer"></div>
  <div id="headerActions">
    <button id="btnExport">JSONに保存</button>
    <button id="btnImportTrigger">JSONを読み込み</button>
    <input type="file" id="fileImport" accept="application/json">
    <button id="btnLogout">ログアウト</button>
  </div>
</header>
<main id="app"></main>

<div id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDOt4ZZx0HEkVGtuJt7nwK5NDvsW6rjcCQ",
    authDomain: "enbase-karte.firebaseapp.com",
    projectId: "enbase-karte",
    storageBucket: "enbase-karte.firebasestorage.app",
    messagingSenderId: "186204856682",
    appId: "1:186204856682:web:76f61185eb22beb7bc8513"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  db.enablePersistence().catch(function(e){ console.warn("offline persistence unavailable", e); });

  var state = {
    customers: [],
    view: "loading",      // loading | login | list | detail | visitForm | kiosk | kioskThanks
    currentCustomerId: null,
    currentVisitId: null,
    search: "",
    user: null
  };
  var kioskTimer = null;
  var unsubCustomers = null;
  var unsubVisits = null;

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function escapeHtml(s){
    if(s === null || s === undefined) return "";
    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#39;");
  }

  function nl2br(s){
    return escapeHtml(s).replace(/\n/g,"<br>");
  }

  function findCustomer(id){
    return state.customers.find(function(c){ return c.id === id; });
  }
  function findVisit(customer, id){
    return (customer.visits||[]).find(function(v){ return v.id === id; });
  }

  // ---------- Firestore data layer ----------

  function setupCustomersListener(){
    if(unsubCustomers) unsubCustomers();
    unsubCustomers = db.collection("customers").onSnapshot(function(snap){
      state.customers = snap.docs.map(function(doc){
        var existing = findCustomer(doc.id);
        var data = doc.data();
        data.id = doc.id;
        data.visits = existing ? existing.visits : [];
        return data;
      });
      render();
    }, function(err){ console.error("customers listener error", err); });
  }

  function setupVisitsListener(customerId){
    if(unsubVisits) unsubVisits();
    unsubVisits = db.collection("customers").doc(customerId).collection("visits").onSnapshot(function(snap){
      var c = findCustomer(customerId);
      if(!c) return;
      c.visits = snap.docs.map(function(doc){ var d = doc.data(); d.id = doc.id; return d; });
      render();
    }, function(err){ console.error("visits listener error", err); });
  }

  function stopVisitsListener(){
    if(unsubVisits){ unsubVisits(); unsubVisits = null; }
  }

  function deleteCustomerCascade(customerId){
    var visitsRef = db.collection("customers").doc(customerId).collection("visits");
    return visitsRef.get().then(function(snap){
      var batch = db.batch();
      snap.docs.forEach(function(d){ batch.delete(d.ref); });
      batch.delete(db.collection("customers").doc(customerId));
      return batch.commit();
    });
  }

  // Keeps a denormalized visitCount/lastVisitDate on the customer doc so the
  // list view can show them without every device needing to have opened
  // that customer's visits subcollection first.
  function updateVisitSummary(customerId){
    return db.collection("customers").doc(customerId).collection("visits").get().then(function(snap){
      var dates = snap.docs.map(function(d){ return d.data().date; }).filter(Boolean).sort();
      return db.collection("customers").doc(customerId).update({
        visitCount: snap.size,
        lastVisitDate: dates.length ? dates[dates.length - 1] : null
      });
    });
  }

  // ---------- auth ----------

  auth.onAuthStateChanged(function(user){
    state.user = user;
    if(user){
      setupCustomersListener();
      if(state.view === "login" || state.view === "loading") state.view = "list";
    } else {
      if(unsubCustomers){ unsubCustomers(); unsubCustomers = null; }
      stopVisitsListener();
      state.customers = [];
      if(state.view !== "kiosk" && state.view !== "kioskThanks"){
        state.view = "login";
      }
    }
    render();
  });

  // ---------- rendering ----------

  function render(){
    if(kioskTimer){ clearTimeout(kioskTimer); kioskTimer = null; }
    var darkViews = ["loading","login","kiosk","kioskThanks"];
    document.body.classList.toggle("kiosk-mode", darkViews.indexOf(state.view) >= 0);
    var headerActions = document.getElementById("headerActions");
    var staffViews = ["list","detail","visitForm"];
    if(headerActions) headerActions.style.display = staffViews.indexOf(state.view) >= 0 ? "" : "none";

    var app = document.getElementById("app");
    if(state.view === "loading"){
      app.innerHTML = renderLoading();
    } else if(state.view === "login"){
      app.innerHTML = renderLogin();
    } else if(state.view === "list"){
      app.innerHTML = renderList();
    } else if(state.view === "detail"){
      var c = findCustomer(state.currentCustomerId);
      if(!c){ state.view = "list"; return render(); }
      app.innerHTML = renderDetail(c);
    } else if(state.view === "visitForm"){
      var c2 = findCustomer(state.currentCustomerId);
      if(!c2){ state.view = "list"; return render(); }
      var v = state.currentVisitId ? findVisit(c2, state.currentVisitId) : null;
      app.innerHTML = renderVisitForm(c2, v);
    } else if(state.view === "kiosk"){
      app.innerHTML = renderKiosk();
    } else if(state.view === "kioskThanks"){
      app.innerHTML = renderKioskThanks();
    }
    bindEvents();
  }

  function renderLoading(){
    return '<div class="kiosk-shell"><img class="kiosk-logo" src="logo-kiosk.png" alt="ENBASE BARBER STAND"><p class="loading-text">読み込み中...</p></div>';
  }

  function renderLogin(){
    return (
      '<div class="kiosk-shell">' +
        '<img class="kiosk-logo" src="logo-kiosk.png" alt="ENBASE BARBER STAND">' +
        '<div class="kiosk-card">' +
          '<h2>スタッフログイン</h2>' +
          '<p class="kiosk-sub">顧客カルテの閲覧・編集にはログインが必要です。</p>' +
          '<label>メールアドレス</label><input type="email" id="login_email">' +
          '<label>パスワード</label><input type="password" id="login_password">' +
          '<div id="loginError" style="color:var(--danger);font-size:13px;margin-top:10px;"></div>' +
          '<button class="kiosk-submit" id="btnLogin">ログイン</button>' +
        '</div>' +
        '<span class="kiosk-footer-link" id="btnGotoKioskFromLogin">お客様はこちら(ログイン不要)</span>' +
      '</div>'
    );
  }

  function renderList(){
    var q = state.search.trim().toLowerCase();
    var list = state.customers.filter(function(c){
      if(!q) return true;
      return (c.name||"").toLowerCase().indexOf(q) >= 0 ||
             (c.nameKana||"").toLowerCase().indexOf(q) >= 0 ||
             (c.phone||"").indexOf(q) >= 0;
    });
    list.sort(function(a,b){ return (a.nameKana||a.name||"").localeCompare(b.nameKana||b.name||"", "ja"); });

    var rows = list.map(function(c){
      var lastVisit = c.lastVisitDate || "-";
      return (
        '<tr class="customer-row" data-id="'+c.id+'">' +
          '<td>'+escapeHtml(c.name)+(c.selfRegistered?'<span class="badge-web">WEB登録</span>':'')+'<div class="muted">'+escapeHtml(c.nameKana||"")+'</div></td>' +
          '<td>'+escapeHtml(c.phone||"-")+'</td>' +
          '<td>'+escapeHtml(lastVisit)+'</td>' +
          '<td class="muted">'+(c.visitCount||0)+'回</td>' +
        '</tr>'
      );
    }).join("");

    return (
      '<div class="kiosk-cta">' +
        '<div class="txt"><h3>お客様ご自身での登録</h3><p>タブレットなどをお渡しして、お客様に直接ご登録いただけます</p></div>' +
        '<button class="btn" id="btnOpenKiosk">お客様登録画面を開く</button>' +
      '</div>' +
      '<div class="toolbar">' +
        '<input type="search" id="searchBox" placeholder="名前・フリガナ・電話番号で検索" value="'+escapeHtml(state.search)+'">' +
        '<button class="btn" id="btnNewCustomer">＋ 新規顧客</button>' +
      '</div>' +
      '<div class="panel">' +
        (list.length ?
          '<table><thead><tr><th>氏名</th><th>電話番号</th><th>最終来店</th><th>来店数</th></tr></thead><tbody>'+rows+'</tbody></table>'
          : '<div class="empty">'+(state.customers.length? '該当する顧客が見つかりません' : 'まだ顧客が登録されていません。「新規顧客」から追加してください。')+'</div>'
        ) +
      '</div>' +
      '<div class="save-note">顧客数: '+state.customers.length+'件 ／ クラウドに保存されており、ログインしたどの端末からも同じデータが見られます。</div>'
    );
  }

  function visitSummaryTags(v){
    var tags = [];
    if(v.menu){
      ["カット","カラー","パーマ","シェービング","トリートメント"].forEach(function(key){
        if(v.menu[key]) tags.push(key);
      });
      if(v.menu.other) tags.push(v.menu.other);
    }
    return tags.map(function(t){ return '<span class="tag">'+escapeHtml(t)+'</span>'; }).join("");
  }

  function renderDetail(c){
    var visits = (c.visits||[]).slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    var visitHtml = visits.map(function(v){
      var photos = (v.photos||[]).map(function(p){
        return '<img src="'+p+'" data-full="'+p+'" class="photo-thumb">';
      }).join("");
      return (
        '<div class="visit-card" data-visit-id="'+v.id+'">' +
          '<div class="visit-head">' +
            '<span class="visit-date">'+escapeHtml(v.date)+'</span>' +
            '<span class="muted">担当: '+escapeHtml(v.staff||"-")+'</span>' +
          '</div>' +
          '<div>'+visitSummaryTags(v)+'</div>' +
          (v.details ? '<div class="visit-detail">'+nl2br(v.details)+'</div>' : "") +
          (v.photos && v.photos.length ? '<div class="photo-row">'+photos+'</div>' : "") +
          (v.nextAppointment ? '<div class="muted" style="margin-top:6px;">次回予約: '+escapeHtml(v.nextAppointment)+'</div>' : "") +
          (v.memo ? '<div class="visit-detail muted">メモ: '+nl2br(v.memo)+'</div>' : "") +
          '<div class="visit-buttons">' +
            '<button class="editVisitBtn" data-id="'+v.id+'">編集</button>' +

  // ---------- photo helpers ----------

  function resizeImage(file, maxDim, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // temp holder for photos being added in the currently open visit form
  var pendingPhotos = [];

  // ---------- event binding ----------

  function bindEvents(){
    if(state.view === "login"){
      document.getElementById("btnLogin").addEventListener("click", function(){
        var email = document.getElementById("login_email").value.trim();
        var pass = document.getElementById("login_password").value;
        var errEl = document.getElementById("loginError");
        errEl.textContent = "";
        if(!email || !pass){ errEl.textContent = "メールアドレスとパスワードを入力してください。"; return; }
        auth.signInWithEmailAndPassword(email, pass).catch(function(){
          errEl.textContent = "ログインに失敗しました。メールアドレスまたはパスワードをご確認ください。";
        });
      });
      document.getElementById("btnGotoKioskFromLogin").addEventListener("click", function(){
        state.view = "kiosk";
        render();
      });
      document.getElementById("login_password").addEventListener("keydown", function(e){
        if(e.key === "Enter") document.getElementById("btnLogin").click();
      });
    }

    if(state.view === "list"){
      var searchBox = document.getElementById("searchBox");
      if(searchBox){
        searchBox.addEventListener("input", function(e){
          state.search = this.value;
          if(e.isComposing) return; // wait for IME (Japanese input) to finish composing
          render();
          // restore focus/cursor after re-render
          var sb = document.getElementById("searchBox");
          if(sb){ sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
        });
        searchBox.addEventListener("compositionend", function(){
          render();
          var sb = document.getElementById("searchBox");
          if(sb){ sb.focus(); sb.setSelectionRange(sb.value.length, sb.value.length); }
        });
      }
      var btnNew = document.getElementById("btnNewCustomer");
      if(btnNew) btnNew.addEventListener("click", function(){
        db.collection("customers").add({
          name:"新しいお客様", nameKana:"", phone:"", birthday:"", gender:"", email:"", address:"", memo:"",
          createdAt: new Date().toISOString()
        }).then(function(docRef){
          state.currentCustomerId = docRef.id;
          state.view = "detail";
          setupVisitsListener(docRef.id);
          render();
        }).catch(function(err){ alert("顧客の作成に失敗しました: " + err.message); });
      });
      var btnOpenKiosk = document.getElementById("btnOpenKiosk");
      if(btnOpenKiosk) btnOpenKiosk.addEventListener("click", function(){
        state.view = "kiosk";
        render();
      });
      document.querySelectorAll(".customer-row").forEach(function(row){
        row.addEventListener("click", function(){
          state.currentCustomerId = row.getAttribute("data-id");
          state.view = "detail";
          setupVisitsListener(state.currentCustomerId);
          render();
        });
      });
    }

    if(state.view === "detail"){
      var c = findCustomer(state.currentCustomerId);
      document.getElementById("backToList").addEventListener("click", function(){
        stopVisitsListener();
        state.view = "list"; render();
      });
      document.getElementById("btnSaveCustomer").addEventListener("click", function(){
        var payload = {
          name: document.getElementById("f_name").value.trim() || "(名前未設定)",
          nameKana: document.getElementById("f_kana").value.trim(),
          phone: document.getElementById("f_phone").value.trim(),
          birthday: document.getElementById("f_birthday").value,
          gender: document.getElementById("f_gender").value,
          email: document.getElementById("f_email").value.trim(),
          address: document.getElementById("f_address").value.trim(),
          memo: document.getElementById("f_memo").value
        };
        db.collection("customers").doc(c.id).update(payload).catch(function(err){
          alert("保存に失敗しました: " + err.message);
        });
      });
      document.getElementById("btnDeleteCustomer").addEventListener("click", function(){
        if(confirm("「"+c.name+"」の顧客データを削除します。よろしいですか?(来店履歴も全て削除されます)")){
          deleteCustomerCascade(c.id).then(function(){
            stopVisitsListener();
            state.view = "list";
            render();
          }).catch(function(err){ alert("削除に失敗しました: " + err.message); });
        }
      });
      document.getElementById("btnPrintCustomer").addEventListener("click", function(){
        printCustomer(c);
      });
      document.getElementById("btnNewVisit").addEventListener("click", function(){
        state.currentVisitId = null;
        state.view = "visitForm";
        render();
      });
      document.querySelectorAll(".editVisitBtn").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.currentVisitId = btn.getAttribute("data-id");
          state.view = "visitForm";
          render();
        });
      });
      document.querySelectorAll(".deleteVisitBtn").forEach(function(btn){
        btn.addEventListener("click", function(){
          if(confirm("この来店記録を削除します。よろしいですか?")){
            var vid = btn.getAttribute("data-id");
            db.collection("customers").doc(c.id).collection("visits").doc(vid).delete().then(function(){
              updateVisitSummary(c.id);
            }).catch(function(err){
              alert("削除に失敗しました: " + err.message);
            });
          }
        });
      });
      document.querySelectorAll(".photo-thumb").forEach(function(img){
        img.addEventListener("click", function(){ showZoom(img.getAttribute("data-full")); });
      });
    }

    if(state.view === "visitForm"){
      pendingPhotos = [];
      var c2 = findCustomer(state.currentCustomerId);
      var existingVisit = state.currentVisitId ? findVisit(c2, state.currentVisitId) : null;
      var currentPhotos = existingVisit ? (existingVisit.photos||[]).slice() : [];

      document.getElementById("backToDetail").addEventListener("click", function(){
        state.view = "detail"; render();
      });
      document.getElementById("btnCancelVisit").addEventListener("click", function(){
        state.view = "detail"; render();
      });

      document.getElementById("v_photoInput").addEventListener("change", function(e){
        var files = Array.prototype.slice.call(e.target.files);
        var remaining = files.length;
        if(!remaining) return;
        files.forEach(function(file){
          resizeImage(file, 1000, 0.75, function(dataUrl){
            currentPhotos.push(dataUrl);
            refreshPhotoPreview();
          });
        });
        e.target.value = "";
      });

      function refreshPhotoPreview(){
        var wrap = document.getElementById("photoPreview");
        wrap.innerHTML = currentPhotos.map(function(p, idx){
          return '<div style="position:relative;"><img src="'+p+'" class="photo-thumb" data-full="'+p+'">' +
            '<button type="button" class="removePhotoBtn" data-idx="'+idx+'" style="position:absolute;top:-6px;right:-6px;background:#b0493f;color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;">×</button></div>';
        }).join("");
        wrap.querySelectorAll(".removePhotoBtn").forEach(function(btn){
          btn.addEventListener("click", function(){
            currentPhotos.splice(parseInt(btn.getAttribute("data-idx"),10), 1);
            refreshPhotoPreview();
          });
        });
        wrap.querySelectorAll(".photo-thumb").forEach(function(img){
          img.addEventListener("click", function(){ showZoom(img.getAttribute("data-full")); });
        });
      }
      refreshPhotoPreview();

      document.getElementById("btnSaveVisit").addEventListener("click", function(){
        var menu = {};
        document.querySelectorAll(".menuCheck").forEach(function(chk){
          if(chk.checked) menu[chk.value] = true;
        });
        var other = document.getElementById("v_other").value.trim();
        if(other) menu.other = other;

        var payload = {
          date: document.getElementById("v_date").value || new Date().toISOString().slice(0,10),
          staff: document.getElementById("v_staff").value.trim(),
          menu: menu,
          details: document.getElementById("v_details").value,
          photos: currentPhotos,
          nextAppointment: document.getElementById("v_next").value,
          memo: document.getElementById("v_memo").value
        };

        var visitsRef = db.collection("customers").doc(c2.id).collection("visits");
        var p;
        if(existingVisit){
          p = visitsRef.doc(existingVisit.id).update(payload);
        } else {
          payload.createdAt = new Date().toISOString();
          p = visitsRef.add(payload);
        }
        p.then(function(){
          return updateVisitSummary(c2.id);
        }).then(function(){
          state.view = "detail";
          state.currentVisitId = null;
          render();
        }).catch(function(err){ alert("保存に失敗しました: " + err.message); });
      });
    }

    if(state.view === "kiosk"){
      document.getElementById("btnKioskExit").addEventListener("click", function(){
        state.view = state.user ? "list" : "login";
        render();
      });
      document.getElementById("btnKioskSubmit").addEventListener("click", function(){
        var name = document.getElementById("k_name").value.trim();
        if(!name){
          alert("お名前を入力してください。");
          return;
        }
        var payload = {
          name: name,
          nameKana: document.getElementById("k_kana").value.trim(),
          phone: document.getElementById("k_phone").value.trim(),
          birthday: document.getElementById("k_birthday").value,
          gender: document.getElementById("k_gender").value,
          email: document.getElementById("k_email").value.trim(),
          memo: document.getElementById("k_memo").value,
          selfRegistered: true,
          createdAt: new Date().toISOString()
        };
        db.collection("customers").add(payload).then(function(){
          state.view = "kioskThanks";
          render();
        }).catch(function(err){
          console.error(err);
          alert("登録に失敗しました。しばらくしてから再度お試しください。");
        });
      });
    }

    if(state.view === "kioskThanks"){
      document.getElementById("btnKioskAgain").addEventListener("click", function(){
        state.view = "kiosk";
        render();
      });
      kioskTimer = setTimeout(function(){
        if(state.view === "kioskThanks"){
          state.view = "kiosk";
          render();
        }
      }, 8000);
    }
  }

  function showZoom(src){
    var overlay = document.createElement("div");
    overlay.className = "zoom-overlay";
    overlay.innerHTML = '<img src="'+src+'">';
    overlay.addEventListener("click", function(){ overlay.remove(); });
    document.body.appendChild(overlay);
  }

  // ---------- print ----------

  function printCustomer(c){
    var visits = (c.visits||[]).slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    var visitsHtml = visits.map(function(v){
      return (
        '<div style="border-top:1px solid #ccc;padding:10px 0;">' +
          '<div><strong>'+escapeHtml(v.date)+'</strong> 　担当: '+escapeHtml(v.staff||"-")+'</div>' +
          '<div>'+visitSummaryTags(v)+'</div>' +
          (v.details ? '<div style="margin-top:4px;">'+nl2br(v.details)+'</div>' : "") +
          (v.nextAppointment ? '<div style="margin-top:4px;color:#555;">次回予約: '+escapeHtml(v.nextAppointment)+'</div>' : "") +
          (v.memo ? '<div style="margin-top:4px;color:#555;">メモ: '+nl2br(v.memo)+'</div>' : "") +
        '</div>'
      );
    }).join("");

    document.getElementById("printArea").innerHTML =
      '<h2>ENBASE カルテ</h2>' +
      '<div><strong>'+escapeHtml(c.name)+'</strong>('+escapeHtml(c.nameKana||"")+')</div>' +
      '<div>電話: '+escapeHtml(c.phone||"-")+' 　生年月日: '+escapeHtml(c.birthday||"-")+' 　性別: '+escapeHtml(c.gender||"-")+'</div>' +
      '<div>住所: '+escapeHtml(c.address||"-")+'</div>' +
      (c.memo ? '<div style="margin-top:6px;">メモ: '+nl2br(c.memo)+'</div>' : "") +
      '<h3 style="margin-top:16px;">来店履歴</h3>' +
      visitsHtml;

    window.print();
  }

  // ---------- export / import ----------

  document.getElementById("btnExport").addEventListener("click", function(){
    db.collection("customers").get().then(function(snap){
      var customers = snap.docs.map(function(d){ var data = d.data(); data.id = d.id; return data; });
      var promises = customers.map(function(c){
        return db.collection("customers").doc(c.id).collection("visits").get().then(function(vsnap){
          c.visits = vsnap.docs.map(function(vd){ var vdata = vd.data(); vdata.id = vd.id; return vdata; });
        });
      });
      return Promise.all(promises).then(function(){ return customers; });
    }).then(function(customers){
      var data = { version:1, exportedAt: new Date().toISOString(), customers: customers };
      var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var ts = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = "karte_" + ts + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }).catch(function(err){
      alert("書き出しに失敗しました: " + err.message);
    });
  });

  document.getElementById("btnImportTrigger").addEventListener("click", function(){
    document.getElementById("fileImport").click();
  });

  document.getElementById("fileImport").addEventListener("change", function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = JSON.parse(evt.target.result);
        if(!data || !Array.isArray(data.customers)) throw new Error("不正な形式です");
        if(!confirm("読み込んだデータ内の顧客数: " + data.customers.length + "件をクラウドに追加します。よろしいですか?")){
          e.target.value = "";
          return;
        }
        var jobs = data.customers.map(function(c){
          var visits = c.visits || [];
          var payload = Object.assign({}, c);
          delete payload.id;
          delete payload.visits;
          return db.collection("customers").add(payload).then(function(docRef){
            return Promise.all(visits.map(function(v){
              var vPayload = Object.assign({}, v);
              delete vPayload.id;
              return docRef.collection("visits").add(vPayload);
            }));
          });
        });
        Promise.all(jobs).then(function(){
          alert("読み込みが完了しました。");
        }).catch(function(err){
          alert("読み込み中にエラーが発生しました: " + err.message);
        });
      }catch(err){
        alert("読み込みに失敗しました: " + err.message);
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("btnLogout").addEventListener("click", function(){
    if(confirm("ログアウトしますか?")){
      stopVisitsListener();
      auth.signOut();
    }
  });

  // ---------- init ----------

  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){
        console.warn("service worker registration failed", e);
      });
    });
  }
})();
